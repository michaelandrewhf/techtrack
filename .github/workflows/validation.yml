name: Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py spectacular --file /tmp/techtrack-openapi.yaml --validate

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techtrack_test
          POSTGRES_USER: techtrack
          POSTGRES_PASSWORD: techtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techtrack -d techtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://techtrack:techtrack@127.0.0.1:5432/techtrack_test
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py check --database default
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose config
        run: docker compose config
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/api/health/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Wait for frontend
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Django check inside Compose
        run: docker compose exec -T backend python manage.py check
      - name: Verify frontend API proxy
        run: curl --fail --silent http://127.0.0.1:5173/api/health/
      - name: Stop online stack
        run: docker compose down
      - name: Start prebuilt stack without internet access
        run: docker compose -f compose.yaml -f compose.offline.yaml up -d --no-build
      - name: Wait for offline backend inside isolated network
        run: |
          for i in $(seq 1 40); do
            if docker compose -f compose.yaml -f compose.offline.yaml exec -T backend \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).read()" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f compose.yaml -f compose.offline.yaml logs
          exit 1
      - name: Wait for offline frontend inside isolated network
        run: |
          for i in $(seq 1 40); do
            if docker compose -f compose.yaml -f compose.offline.yaml exec -T frontend \
              node -e "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f compose.yaml -f compose.offline.yaml logs
          exit 1
      - name: Verify offline frontend API proxy inside isolated network
        run: |
          docker compose -f compose.yaml -f compose.offline.yaml exec -T frontend \
            node -e "fetch('http://127.0.0.1:5173/api/health/').then(async r => { if (!r.ok) process.exit(1); const data = await r.json(); if (data.status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"
      - name: Show offline service status
        run: docker compose -f compose.yaml -f compose.offline.yaml ps
      - if: always()
        run: docker compose -f compose.yaml -f compose.offline.yaml down -v

  production-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-production-db-password
      DJANGO_SECRET_KEY: ci-production-secret-key-not-for-real-use
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup scripts
        run: bash -n scripts/postgres-backup.sh scripts/postgres-restore.sh
      - name: Validate production Compose config
        run: docker compose -f compose.prod.yaml config
      - name: Build production stack
        run: docker compose -f compose.prod.yaml build
      - name: Start production stack
        run: docker compose -f compose.prod.yaml up -d
      - name: Wait for production frontend
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f compose.prod.yaml logs
          exit 1
      - name: Verify production API proxy
        run: curl --fail --silent http://127.0.0.1:8080/api/health/
      - name: Verify production security headers
        run: |
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi '^X-Content-Type-Options: nosniff'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi '^X-Frame-Options: DENY'
      - name: Verify backend production checks
        run: docker compose -f compose.prod.yaml exec -T backend python manage.py check
      - name: Verify backend runs as non-root
        run: test "$(docker compose -f compose.prod.yaml exec -T backend id -u | tr -d '\r')" = "10001"
      - name: Verify PostgreSQL backup and restore
        run: |
          rm -rf /tmp/techtrack-backups
          printf '%s\n' \
            "CREATE TABLE backup_restore_smoke (id integer PRIMARY KEY, marker text NOT NULL);" \
            "INSERT INTO backup_restore_smoke (id, marker) VALUES (1, 'before');" \
            | docker compose -f compose.prod.yaml exec -T db sh -eu -c \
              'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1'

          BACKUP_DIR=/tmp/techtrack-backups \
            bash scripts/postgres-backup.sh
          backup_path=$(find /tmp/techtrack-backups -maxdepth 1 -type f -name 'techtrack_*.dump' | head -n 1)
          test -n "$backup_path"
          test -f "${backup_path}.sha256"

          printf '%s\n' "UPDATE backup_restore_smoke SET marker = 'after' WHERE id = 1;" \
            | docker compose -f compose.prod.yaml exec -T db sh -eu -c \
              'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1'

          RESTORE_SAFETY_BACKUP=false \
            BACKUP_DIR=/tmp/techtrack-backups \
            bash scripts/postgres-restore.sh "$backup_path" --yes

          restored_marker=$(printf '%s\n' "SELECT marker FROM backup_restore_smoke WHERE id = 1;" \
            | docker compose -f compose.prod.yaml exec -T db sh -eu -c \
              'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --tuples-only --no-align' \
            | tr -d '[:space:]')
          test "$restored_marker" = "before"

          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f compose.prod.yaml logs
          exit 1
      - name: Show production service status
        run: docker compose -f compose.prod.yaml ps
      - if: always()
        run: docker compose -f compose.prod.yaml down -v

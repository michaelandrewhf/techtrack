name: Apply first billing choice

on:
  push:
    branches: [feature/first-month-billing-choice]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/first-month-billing-choice
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python .github/scripts/apply_first_billing_choice.py
      - run: uv run ruff format finance
      - run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/pages/CustomerDetailPage.tsx src/pages/FinancePage.tsx src/api/types.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support first monthly billing choice"
          git push origin HEAD:feature/first-month-billing-choice

name: Format UX final once

on:
  push:
    branches: [ux-ui-final-polish]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-ui-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format changed frontend files
        working-directory: frontend
        run: >-
          pnpm exec prettier --write
          src/App.test.tsx
          src/pages/BusinessProfilePage.tsx
          src/pages/LoginPage.tsx
          src/pages/ProfilePage.tsx
          src/pages/SettingsPage.tsx
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.test.tsx frontend/src/pages/BusinessProfilePage.tsx frontend/src/pages/LoginPage.tsx frontend/src/pages/ProfilePage.tsx frontend/src/pages/SettingsPage.tsx
          git rm .github/workflows/format-ux-final-once.yml
          git commit -m "style: format final UX polish"
          git push origin ux-ui-final-polish

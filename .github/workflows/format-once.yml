name: One-time frontend formatter

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm exec prettier --write src/api/endpoints.ts src/pages/CustomerDetailPage.tsx src/pages/FinancePage.tsx src/pages/QuoteCreatePage.tsx src/pages/QuoteDetailPage.tsx src/pages/QuotesPage.tsx src/pages/WorkOrderDetailPage.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "style: format finance and quote frontend"
          git push origin HEAD:master
